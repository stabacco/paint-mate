name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn test
      - name: Build for GitHub Pages
        env:
          GITHUB_PAGES: true
        run: |
          cp index.dev.html index.html
          yarn build
      - name: Prepare Pages files
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
      - name: Publish built site to main branch root
        run: |
          cp dist/index.html index.html
          cp dist/404.html 404.html
          cp dist/manifest.webmanifest manifest.webmanifest
          cp dist/favicon.svg favicon.svg
          rm -rf assets
          cp -r dist/assets assets
          cp dist/.nojekyll .nojekyll
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git add -f index.html 404.html manifest.webmanifest favicon.svg assets .nojekyll
          git diff --staged --quiet || git commit -m "Deploy GitHub Pages"
          git push
